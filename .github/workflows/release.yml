# Builds Escape Artist on GitHub's servers and publishes a release when a version tag is pushed
# (e.g. v0.3.0). The release has the installer plus latest.json, which installed apps read to find
# and verify updates. Built here, not on a personal PC, so no local paths end up in the program.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits (tag in the comment): a moved or hijacked tag can't
      # run new code in the job that holds the update-signing key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24   # same npm as local development (npm 11), so the lock file matches
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # npm install (not npm ci): the build machine resolves a couple of optional WebAssembly
      # helper packages that the lock file made on a dev PC doesn't list; ci would refuse.
      - run: npm install --no-audit --no-fund

      # Quest data + map images + story chapters bundled for offline first runs
      # (some tests check real data against it, so it comes first).
      - name: Data snapshot
        run: npm run snapshot

      - name: Tests
        run: npm test

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Escape Artist ${{ github.ref_name }}
          releaseBody: |
            **Download:** `Escape Artist_*_x64-setup.exe` below, then run it.
            Already installed? The app updates itself: it offers this version the next time it starts.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
